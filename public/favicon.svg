<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="50%" stop-color="#07111e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="6"/>

  <!-- Mini Split Indoor Unit Body -->
  <g transform="translate(66, 110)">
    <!-- Main AC Casing -->
    <rect x="0" y="0" width="380" height="150" rx="24" fill="#ffffff" filter="url(#glow)"/>
    <rect x="10" y="10" width="360" height="130" rx="16" fill="#f8fafc"/>
    
    <!-- Top Intake Louvers -->
    <line x1="40" y1="35" x2="340" y2="35" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="50" x2="340" y2="50" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="65" x2="340" y2="65" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Bottom Discharge Vane -->
    <rect x="30" y="115" width="320" height="18" rx="8" fill="url(#cyanGrad)"/>

    <!-- Status Power LED & Display -->
    <circle cx="330" cy="95" r="7" fill="#10b981"/>
    <circle cx="308" cy="95" r="5" fill="#38bdf8"/>
    <circle cx="292" cy="95" r="5" fill="url(#orangeGrad)"/>
  </g>

  <!-- Airflow & Pro Repair Dynamic Waves (Cooling + Heating) -->
  <g transform="translate(90, 275)">
    <!-- Cool Air Left Wave -->
    <path d="M 40,20 Q 70,80 30,130 Q -10,180 30,220" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Cool Air Middle Wave -->
    <path d="M 120,10 Q 170,70 130,130 Q 90,190 140,220" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- Center Pro Repair Gear & Flame -->
    <g transform="translate(140, 20)">
      <!-- Pro Shield / Badge -->
      <circle cx="35" cy="55" r="46" fill="url(#orangeGrad)"/>
      <path d="M 35,28 L 47,40 L 47,56 L 35,78 L 23,56 L 23,40 Z" fill="#ffffff"/>
      <circle cx="35" cy="46" r="5" fill="#ea580c"/>
    </g>
    <!-- Warm Air Right Wave -->
    <path d="M 230,15 Q 275,75 240,135 Q 205,190 250,220" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 300,20 Q 330,80 295,135 Q 260,190 290,220" fill="none" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
